name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: npm run typecheck

      - name: Test installer API compatibility gate
        run: node --test scripts/check-workspace-api.test.mjs

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  verify-store-automation:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/store-release/macos/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.11"
          bundler-cache: true

      - name: Verify store release structure
        run: node scripts/store-release/check-readiness.mjs

      - name: List Mac App Store lanes
        working-directory: scripts/store-release/macos
        run: bundle exec fastlane lanes

      - name: Verify Mac App Store lane
        working-directory: scripts/store-release/macos
        run: bundle exec fastlane mac verify
