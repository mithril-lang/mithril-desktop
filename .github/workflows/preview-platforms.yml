name: Publish Preview Platforms

# Adds native Windows, Linux, and Intel Mac packages to an existing Mithril
# preview release. Publishing happens only after every platform build and
# package inspection succeeds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing prerelease tag to receive the platform installers"
        type: string
        required: true
        default: "v0.8.0-preview.1"

permissions:
  contents: write

concurrency:
  group: preview-platforms-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate preview release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag and existing prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "$TAG must already exist as a prerelease" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  mac_intel:
    name: Build Intel Mac
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, mithril-desktop-trusted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native dependencies for Intel
        run: npx electron-builder install-app-deps --arch=x64
      - name: Build app
        run: npm run build
      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64:-}" ]; then
            echo "ASC_API_KEY secret is missing — notarization will fail." >&2
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/appstore"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Import macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/import-macos-certificate.sh
      - name: Package Intel Mac artifacts
        env:
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npx electron-builder --mac dmg zip --x64 --publish never
      - name: Remove macOS signing keychain
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
      - name: Verify Intel package
        run: |
          set -euo pipefail
          bash scripts/verify-native-module-architecture.sh x64
          codesign --verify --deep --strict --verbose=2 dist/mac/Mithril.app
          spctl --assess --type execute --verbose=4 dist/mac/Mithril.app
          file dist/mac/Mithril.app/Contents/MacOS/Mithril | grep -q 'x86_64'
          test -f "dist/mithril-desktop-${{ needs.prepare.outputs.version }}-x64.dmg"
          test -f "dist/mithril-desktop-${{ needs.prepare.outputs.version }}-x64-mac.zip"
      - name: Upload Intel Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-mac-x64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/preview-mac.yml

  mac_arm64:
    name: Build Apple silicon Mac
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, mithril-desktop-trusted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native dependencies for Apple silicon
        run: npx electron-builder install-app-deps --arch=arm64
      - name: Build app
        run: npm run build
      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64:-}" ]; then
            echo "ASC_API_KEY secret is missing — notarization will fail." >&2
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/appstore"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Import macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/import-macos-certificate.sh
      - name: Package Apple silicon artifacts
        env:
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Remove macOS signing keychain
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
      - name: Verify Apple silicon package
        run: |
          set -euo pipefail
          bash scripts/verify-native-module-architecture.sh arm64
          APP="dist/mac-arm64/Mithril.app"
          if [ ! -d "$APP" ]; then APP="dist/mac/Mithril.app"; fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          file "$APP/Contents/MacOS/Mithril" | grep -q 'arm64'
          test -f "dist/mithril-desktop-${{ needs.prepare.outputs.version }}-arm64.dmg"
          test -f "dist/mithril-desktop-${{ needs.prepare.outputs.version }}-arm64-mac.zip"
      - name: Upload Apple silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-mac-arm64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/preview-mac.yml

  windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify native Windows archive destination replacement
        run: npx vitest run src/main/archive-save.test.ts
      - name: Build app
        run: npm run build
      # Windows signing is selected by the repository variable WIN_SIGNING:
      #   azure   - Azure Artifact Signing (secrets: AZURE_TENANT_ID,
      #             AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; variables:
      #             AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE,
      #             AZURE_SIGN_PUBLISHER)
      #   esigner - SSL.com OV certificate on eSigner cloud HSM (secrets:
      #             ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET;
      #             variable: WIN_PUBLISHER_NAME)
      #   (unset) - unsigned build with a loud warning, as before.
      # See docs/windows-signing.md.
      - name: Resolve Windows signing mode
        id: winsign
        shell: bash
        env:
          MODE: ${{ vars.WIN_SIGNING }}
        run: |
          set -euo pipefail
          case "${MODE:-}" in
            azure|esigner) echo "mode=$MODE" >> "$GITHUB_OUTPUT" ;;
            "") echo "mode=none" >> "$GITHUB_OUTPUT"
                echo "::warning::WIN_SIGNING is not set; the Windows installer will be UNSIGNED." ;;
            *) echo "Unknown WIN_SIGNING value: $MODE" >&2; exit 1 ;;
          esac
      - name: Install CodeSignTool (eSigner)
        if: steps.winsign.outputs.mode == 'esigner'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
          $dir = Join-Path $env:RUNNER_TEMP "codesigntool"
          Invoke-WebRequest "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $bat = Get-ChildItem $dir -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat not found in the download" }
          "CODESIGNTOOL_DIR=$($bat.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package Windows artifacts (unsigned)
        if: steps.winsign.outputs.mode == 'none'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Package Windows artifacts (Azure Artifact Signing)
        if: steps.winsign.outputs.mode == 'azure'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          npx electron-builder --win nsis portable --x64 --publish never
          -c.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGN_ENDPOINT }}"
          -c.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_SIGN_ACCOUNT }}"
          -c.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_SIGN_PROFILE }}"
          -c.win.azureSignOptions.publisherName="${{ vars.AZURE_SIGN_PUBLISHER }}"
      - name: Package Windows artifacts (SSL.com eSigner)
        if: steps.winsign.outputs.mode == 'esigner'
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: >
          npx electron-builder --win nsis portable --x64 --publish never
          -c.win.sign=scripts/win-sign-esigner.cjs
          -c.win.signtoolOptions.publisherName="${{ vars.WIN_PUBLISHER_NAME }}"
      - name: Verify Windows signatures
        if: steps.winsign.outputs.mode != 'none'
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          foreach ($f in @("dist/mithril-desktop-$version-setup.exe", "dist/mithril-desktop-$version-portable.exe", "dist/win-unpacked/mithril.exe")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) | $($sig.SignerCertificate.Subject) | timestamp: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed ($($sig.Status))" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no countersignature timestamp" }
          }
      - name: Inspect Windows packages
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $setup = "dist/mithril-desktop-$version-setup.exe"
          $portable = "dist/mithril-desktop-$version-portable.exe"
          if (!(Test-Path $setup) -or !(Test-Path $portable) -or !(Test-Path "dist/preview.yml")) {
            throw "Expected Windows installer, portable app, and preview.yml"
          }
          $app = "dist/win-unpacked/mithril.exe"
          if (!(Test-Path $app)) { throw "The packaged x64 application executable is missing" }
          if ([System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($app), 0, 2) -ne "MZ") {
            throw "The packaged application does not have a Windows PE header"
          }
          7z t $setup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer integrity test failed" }
          7z t $portable | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Portable executable integrity test failed" }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows-x64-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/preview.yml

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native dependencies
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}
      - name: Build app
        run: npm run build
      - name: Package Linux artifacts
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never
      - name: Inspect Linux packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APPIMAGE_ARCH=$ARCH
          if [ "$ARCH" = x64 ]; then APPIMAGE_ARCH=x86_64; fi
          APPIMAGE="dist/mithril-desktop-$VERSION-$APPIMAGE_ARCH.AppImage"
          test -f "$APPIMAGE"
          DEB_ARCH=amd64
          ELF_ARCH='x86-64'
          FEED=dist/preview-linux.yml
          if [ "$ARCH" = arm64 ]; then
            DEB_ARCH=arm64
            ELF_ARCH='aarch64'
            FEED=dist/preview-linux-arm64.yml
          fi
          DEB=$(find dist -maxdepth 1 -name "mithril-desktop_${VERSION}_${DEB_ARCH}.deb" -print -quit)
          test -n "$DEB"
          test -f "$FEED"
          rm -rf appimage-root deb-root squashfs-root
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          mv squashfs-root appimage-root
          file appimage-root/mithril-desktop | grep -q "$ELF_ARCH"
          mkdir deb-root
          dpkg-deb -x "$DEB" deb-root
          file deb-root/opt/Mithril/mithril-desktop | grep -q "$ELF_ARCH"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-linux-${{ matrix.arch }}-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/preview-linux*.yml

  publish:
    name: Add installers to prerelease
    needs: [prepare, mac_intel, mac_arm64, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download new artifacts
        uses: actions/download-artifact@v4
        with:
          path: new-artifacts
          merge-multiple: true
      - name: Download existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p all-artifacts
          # A brand-new prerelease has no assets yet; downloading then fails.
          ASSET_COUNT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$ASSET_COUNT" != "0" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir all-artifacts
          fi
          cp new-artifacts/* all-artifacts/
      - name: Merge macOS update feed across architectures
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Rebuild preview-mac.yml from every arch zip/dmg already on the
          # release plus this run's Intel artifacts so --clobber cannot drop
          # arm64 (or a later arm64 publish cannot drop x64).
          node scripts/merge-mac-update-feed.mjs \
            --artifacts all-artifacts \
            --version "$VERSION" \
            --product mithril-desktop \
            --require-both \
            -o new-artifacts/preview-mac.yml
      - name: Generate consolidated checksums
        run: |
          set -euo pipefail
          rm -f all-artifacts/SHA256SUMS
          find all-artifacts -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) \
            -printf '%f\n' | sort | while read -r name; do
              sha256sum "all-artifacts/$name"
            done | sed 's#  all-artifacts/#  #' > SHA256SUMS
      - name: Publish platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" new-artifacts/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
